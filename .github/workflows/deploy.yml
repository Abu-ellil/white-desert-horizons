name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI (pinned)
        run: npm i -g vercel@60.1.3

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build (vercel build)
        run: vercel build --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # The prebuilt server bundle imports 'tslib' as a bare external, but the
      # deployed lambda ships without node_modules — patch it in before upload.
      - name: Patch tslib into prebuilt output
        run: |
          mkdir -p .vercel/output/functions/__server.func/node_modules/tslib
          cp -r node_modules/tslib/. .vercel/output/functions/__server.func/node_modules/tslib/
          ls -la .vercel/output/functions/
          find .vercel/output/functions -name ".vc-config.json" | head -5

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --archive=tgz --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
