name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      # The Lovable vite plugin builds the app AND emits the Vercel Build
      # Output API into .vercel/output as part of `vite build` — no
      # `vercel build` needed (it would mis-detect the framework on CI).
      - name: Build
        run: npm run build

      # The prebuilt server bundle imports 'tslib' as a bare external, but the
      # deployed lambda ships without node_modules — patch it in before upload.
      - name: Patch tslib into prebuilt output
        run: |
          mkdir -p .vercel/output/functions/__server.func/node_modules/tslib
          cp -r node_modules/tslib/. .vercel/output/functions/__server.func/node_modules/tslib/
          find .vercel/output/functions -name ".vc-config.json"

      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --archive=tgz --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
