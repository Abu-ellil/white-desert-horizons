name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Patch missing tslib into prebuilt output
        run: |
          mkdir -p .vercel/output/functions/__server.func/node_modules/tslib
          cp -r node_modules/tslib/. .vercel/output/functions/__server.func/node_modules/tslib/

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --prebuilt --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
